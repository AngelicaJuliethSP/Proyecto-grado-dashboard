name: CI — Ejecución de pruebas y publicación de resultados

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5" # Lunes a viernes 6:00 UTC

jobs:
  web-tests:
    name: SauceDemo (Web UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout SauceDemoAutomation
        uses: actions/checkout@v4
        with:
          repository: <TU_USUARIO>/SauceDemoAutomation
          ref: main
          path: projects/SauceDemoAutomation

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ejecutar pruebas
        working-directory: projects/SauceDemoAutomation
        run: mvn clean test -B

      - name: Parsear resultados
        run: |
          python parser/results_parser.py \
            --project SauceDemoAutomation \
            --reports-dir projects/SauceDemoAutomation/target/surefire-reports \
            --output data/results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-saucedemo
          path: data/results.json

  mobile-tests:
    name: WdioMobile (Mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout WdioMobileAutomation
        uses: actions/checkout@v4
        with:
          repository: <TU_USUARIO>/WdioMobileAutomation
          ref: main
          path: projects/WdioMobileAutomation

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Configurar Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium --base-path /wd/hub &
          sleep 5

      - name: Ejecutar pruebas
        working-directory: projects/WdioMobileAutomation
        run: mvn clean test -B
        continue-on-error: true

      - name: Parsear resultados
        run: |
          python parser/results_parser.py \
            --project WdioMobileAutomation \
            --reports-dir projects/WdioMobileAutomation/target/surefire-reports \
            --output data/results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-wdiomobile
          path: data/results.json

  api-tests:
    name: PetStore (API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Checkout PetStoreRestAssured
        uses: actions/checkout@v4
        with:
          repository: <TU_USUARIO>/PetStoreRestAssured
          ref: main
          path: projects/PetStoreRestAssured

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Ejecutar pruebas
        working-directory: projects/PetStoreRestAssured
        run: mvn clean test -B

      - name: Parsear resultados
        run: |
          python parser/results_parser.py \
            --project PetStoreRestAssured \
            --reports-dir projects/PetStoreRestAssured/target/surefire-reports \
            --output data/results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-petstore
          path: data/results.json

  publish-dashboard-data:
    name: Consolidar y publicar datos del dashboard
    needs: [web-tests, mobile-tests, api-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Descargar artefactos de resultados
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Consolidar resultados en data/results.json
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path

          merged = []
          for artifact_dir in Path("artifacts").iterdir():
              results_file = artifact_dir / "results.json"
              if results_file.exists():
                  merged.extend(json.loads(results_file.read_text(encoding="utf-8")))

          Path("data").mkdir(exist_ok=True)
          Path("data/results.json").write_text(
              json.dumps(merged, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(f"Consolidadas {len(merged)} ejecuciones.")
          EOF

      - name: Commit de resultados al histórico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "ci: actualizar resultados de pruebas [skip ci]"
          git push
